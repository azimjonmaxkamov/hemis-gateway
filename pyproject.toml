[project]
name = "hemis-api-gateway"
version = "1.0.0"
description = "Secure, filtered API gateway and control panel for the HEMIS university information system"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Azimjon Makhkamov", email = "raqamlivodiy@gmail.com" }]
maintainers = [{ name = "Azimjon Makhkamov", email = "raqamlivodiy@gmail.com" }]
requires-python = ">=3.11"
keywords = ["HEMIS", "api-gateway", "higher-education", "uzbekistan", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Education",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
