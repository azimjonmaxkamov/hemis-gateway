# Gateway bloklagan IP larni server firewall (iptables/nftables) darajasida ham yopish.
# Shunda bloklangan IP so'rovlari nginx va ilovaga umuman yetib kelmaydi.
[hemis-gateway]
enabled  = true
filter   = hemis-gateway
logpath  = /opt/hemis-gateway/data/security.log
backend  = auto
maxretry = 1
findtime = 600
# gateway ichidagi bosqichli ban bilan bir xil: birinchi 15 daq, takrorlansa uzayadi
bantime  = 900
bantime.increment = true
bantime.factor    = 4
bantime.maxtime   = 86400
port     = http,https
# OTM tarmog'i va admin IP larini hech qachon bloklamaslik:
ignoreip = 127.0.0.1/8 ::1
