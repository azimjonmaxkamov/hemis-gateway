# Gateway avtomatik yoki qo'lda bloklagan IP lar (data/security.log)
# Qator namunasi: 2026-11-09T10:15:02Z BAN ip=91.204.12.77 duration=900 auto=1 reason=...
[Definition]
failregex = ^\S+ BAN ip=<HOST> duration=\d+
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%SZ
