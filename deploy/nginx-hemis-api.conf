# Nginx reverse proxy for HEMIS API Gateway. Replace hemis-api.example.uz with your domain.
# /etc/nginx/sites-available/hemis-api.example.uz
# SSL: sudo certbot --nginx -d hemis-api.example.uz

limit_req_zone $binary_remote_addr zone=hg_ip:10m rate=50r/s;

server {
    listen 80;
    server_name hemis-api.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hemis-api.example.uz;

    ssl_certificate     /etc/letsencrypt/live/hemis-api.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hemis-api.example.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 25m;

    # Admin panelni faqat OTM tarmog'iga ochish (ixtiyoriy, tavsiya etiladi):
    # location ~ ^/(admin|api/admin) {
    #     allow 195.158.0.0/16;   # OTM IP diapazoni
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     include /etc/nginx/hg_proxy.conf;
    # }

    location / {
        limit_req zone=hg_ip burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;           # gateway shu headerga ishonadi
        proxy_set_header X-Forwarded-For $remote_addr;     # mijoz yuborgan XFF ni almashtiramiz (soxtalashtirishga qarshi)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
